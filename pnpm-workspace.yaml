ignoredBuiltDependencies:
  - '@parcel/watcher'
  - 'esbuild'
  - 'vue-demi'

overrides:
  '@nuxt/devtools': '4.0.0-alpha.4'
  '@nuxt/devtools-kit': '4.0.0-alpha.4'
  vite@*: 'catalog:'
  vitest@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
  '@vitest/browser-playwright': 5.0.5
  '@vitest/coverage-v8': 5.0.5
